[project]
name = "minecraft-rl"
version = "0.1.0"
description = "Reinforcement Learning agent for Minecraft using MineRL + PPO"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    # Core RL
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",

    # MineRL — pinned, Windows-compatible
    "minerl==0.4.4",

    # Deep learning — CPU build (DirectML added separately via pip)
    "torch==2.2.2",
    "torchvision==0.17.2",

    # Vision
    "opencv-python>=4.9.0",

    # Monitoring
    "tensorboard>=2.16.0",

    # Utilities
    "numpy>=1.26.0,<2.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "imageio>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
]

[tool.uv]
# torch-directml installed via post-install script (not on PyPI index standard)
# See scripts/setup_directml.ps1

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]